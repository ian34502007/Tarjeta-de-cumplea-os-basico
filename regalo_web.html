<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Regalo de cumpleaños</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background: rgba(255, 255, 255, 0.18);
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 28px;
            margin-top: 0;
        }

        input,
        button {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            margin-top: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            background: white;
            color: #ff5d5d;
            font-weight: bold;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        .answer {
            margin-top: 12px;
            font-weight: bold;
        }

        .small {
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="card">
        <div id="inicio">
            <h1>🎉🎂 Feliz cumpleaños, amigo 🎂🎉</h1>
            <p>¿Cómo te llamas?</p>
            <input id="nombre" type="text" placeholder="Tu nombre" />
            <p>¿Cuántos años cumples?</p>
            <input id="edad" type="text" placeholder="Tu edad" />
            <button onclick="empezar()">Comenzar regalo</button>
        </div>

        <div id="juego" class="hidden">
            <p id="bienvenida"></p>
            <div id="preguntaActual"></div>
            <div id="opciones"></div>
            <div id="resultado" class="answer"></div>
            <button onclick="siguientePregunta()">Siguiente</button>
        </div>

        <div id="final" class="hidden">
            <h2>🎁 Sorpresa final</h2>
            <p id="mensajeFinal"></p>
        </div>
    </div>

    <script>
        const preguntas = [
            { pregunta: 'Pista 1: ¿Qué color suele asociarse con la alegría y la felicidad?', opciones: ['Amarillo', 'Azul', 'Verde'], correcta: 'Amarillo' },
            { pregunta: 'Pista 2: ¿Qué te deseo yo para tu cumpleaños?', opciones: ['Felicidad', 'Tristeza', 'Enojo'], correcta: 'Felicidad' },
            { pregunta: 'Pista 3: ¿Qué palabra completa esta frase: Feliz ________?', opciones: ['Cumpleaños', 'Invierno', 'Lápiz'], correcta: 'Cumpleaños' },
            { pregunta: 'Pista 4: ¿Qué te regalo hoy con todo mi cariño?', opciones: ['una gran vida', 'Una nube', 'Un reloj'], correcta: 'una gran vida' },
            { pregunta: 'Pista 5: ¿Cómo te describiría hoy en este día tan especial?', opciones: ['Especial', 'Cansado', 'Enojado'], correcta: 'Especial' }
        ];

        let indice = 0;
        let nombre = '';
        let edad = '';

        function empezar() {
            nombre = document.getElementById('nombre').value.trim() || 'amigo';
            edad = document.getElementById('edad').value.trim() || 'muchos';
            document.getElementById('inicio').classList.add('hidden');
            document.getElementById('juego').classList.remove('hidden');
            document.getElementById('bienvenida').innerText = `Hola ${nombre}, hoy cumples ${edad} años. Y por eso te tengo un regalo muy especial...`;
            mostrarPregunta();
        }

        function mostrarPregunta() {
            const pregunta = preguntas[indice];
            document.getElementById('preguntaActual').innerHTML = `<p>${pregunta.pregunta}</p>`;
            const opciones = [...pregunta.opciones].sort(() => Math.random() - 0.5);
            let html = '';
            opciones.forEach((op) => {
                html += `<button onclick="evaluar('${op}')">${op}</button>`;
            });
            document.getElementById('opciones').innerHTML = html;
            document.getElementById('resultado').innerText = '';
        }

        function evaluar(opcion) {
            const pregunta = preguntas[indice];
            const correcto = opcion === pregunta.correcta;
            document.getElementById('resultado').innerText = correcto ? '¡Correcto! 🎉' : `No es correcto. La respuesta correcta era: ${pregunta.correcta}`;
            indice += 1;
            if (indice >= preguntas.length) {
                document.getElementById('juego').classList.add('hidden');
                document.getElementById('final').classList.remove('hidden');
                document.getElementById('mensajeFinal').innerHTML = `Querido ${nombre}:<br><br>Deseo que este año esté lleno de alegría, éxito, amor y muchas aventuras. Que todos tus sueños se cumplan y que cada día sea especial. ¡Feliz cumpleaños! 🥳`;
            }
        }

        function siguientePregunta() {
            if (indice < preguntas.length) {
                mostrarPregunta();
            }
        }
    </script>
</body>

</html>
